name: publish-due

# Posts what you already approved. It cannot approve anything:
# pipeline/gates.py refuses to clear a gate during a scheduled run, and a
# test asserts it. That asymmetry is the whole design.

on:
  schedule:
    - cron: "0 3 * * *"    # 08:30 IST
    - cron: "0 14 * * *"   # 19:30 IST
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD || vars.SMTP_APP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || vars.ALERT_EMAIL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || vars.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt -r requirements-publish.txt
      - name: Restore the YouTube credentials
        env:
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON || vars.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$TOKEN_JSON" ]; then
            echo "::error::YOUTUBE_TOKEN_JSON is not set"; exit 1
          fi
          mkdir -p secrets && chmod 700 secrets
          printf '%s' "$TOKEN_JSON" > secrets/youtube_token.json
          chmod 600 secrets/youtube_token.json
      - run: python run.py publish-due
      - name: Forget the credentials
        if: always()
        run: rm -rf secrets
