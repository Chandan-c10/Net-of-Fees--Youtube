name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because the likeliest future break is not a change here but a
  # release of something this depends on. Without a schedule, upstream
  # breakage is discovered during a render rather than in CI.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The pipeline resolves binaries, fonts and concat paths per OS,
        # so both targets are tested rather than assumed -- see
        # pipeline/platform_support.py.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        include:
          # A warning leg, not a gate: it reports breakage on the next
          # Python before that version is the one being used. 3.15 makes
          # UTF-8 the default, which this project already handles
          # explicitly.
          - os: ubuntu-latest
            python: "3.13"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Without FFmpeg, 31 tests skip -- the render and preflight ones,
      # which are exactly what the Windows leg exists to check. A green
      # run that skipped them is worse than no run.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the environment
        run: python run.py doctor

      - name: Lint
        run: python -m ruff check .

      - name: Test
        continue-on-error: ${{ matrix.experimental || false }}
        shell: bash
        run: |
          # Written to the job summary as well as the log, because the
          # log needs admin rights on the repository to read and the
          # summary does not. A CI failure nobody can see the reason
          # for is a CI failure nobody fixes -- this one went unread
          # for two weeks.
          set -o pipefail
          # pytest's own exit code is the verdict. The first version
          # swallowed it with `|| true` and then tried to work the
          # answer out by grepping the output, which got it wrong and
          # failed runs that had passed. Never re-derive something the
          # tool already told you.
          status=0
          python -m pytest -q -ra --tb=short 2>&1 | tee /tmp/pytest.out \
            || status=$?
          {
            echo "### ${{ matrix.os }} / Python ${{ matrix.python }}"
            echo
            echo '```'
            tail -n 60 /tmp/pytest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also as annotations, which are readable through the public
          # API. The job summary is not, and the log needs admin -- so
          # without this the reason a run failed is visible only to the
          # repository owner, which is how fifty red runs went unread.
          named=$(grep -cE "^(FAILED|ERROR) " /tmp/pytest.out || true)
          if [ "$named" -gt 0 ]; then
            grep -E "^(FAILED|ERROR) " /tmp/pytest.out | head -20 | while read -r line; do
              echo "::error title=${{ matrix.os }} py${{ matrix.python }}::$line"
            done
          elif [ "$status" -ne 0 ]; then
            # A red run that names no test. The Linux legs failed this way
            # and the reason was readable only with admin rights on the
            # repository, which is the exact hole the annotations were
            # added to close -- so close it for this case too, rather
            # than assuming every failure is a failing test.
            echo "::error title=${{ matrix.os }} py${{ matrix.python }}::pytest exited $status naming no test; last lines follow"
            tail -n 15 /tmp/pytest.out | while read -r line; do
              [ -n "$line" ] && echo "::error title=${{ matrix.os }} py${{ matrix.python }}::$line"
            done
          fi
          exit $status
