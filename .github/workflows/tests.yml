name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The pipeline resolves binaries, fonts and concat paths per OS,
        # so both targets are tested rather than assumed -- see
        # pipeline/platform_support.py.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Without FFmpeg, 31 tests skip -- the render and preflight ones,
      # which are exactly what the Windows leg exists to check. A green
      # run that skipped them is worse than no run.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the environment
        run: python run.py doctor

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q -ra
