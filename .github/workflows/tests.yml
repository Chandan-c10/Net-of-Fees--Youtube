name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because the likeliest future break is not a change here but a
  # release of something this depends on. Without a schedule, upstream
  # breakage is discovered during a render rather than in CI.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The pipeline resolves binaries, fonts and concat paths per OS,
        # so both targets are tested rather than assumed -- see
        # pipeline/platform_support.py.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        include:
          # A warning leg, not a gate: it reports breakage on the next
          # Python before that version is the one being used. 3.15 makes
          # UTF-8 the default, which this project already handles
          # explicitly.
          - os: ubuntu-latest
            python: "3.13"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Without FFmpeg, 31 tests skip -- the render and preflight ones,
      # which are exactly what the Windows leg exists to check. A green
      # run that skipped them is worse than no run.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the environment
        run: python run.py doctor

      - name: Lint
        run: python -m ruff check .

      - name: Test
        continue-on-error: ${{ matrix.experimental || false }}
        run: python -m pytest -q -ra
