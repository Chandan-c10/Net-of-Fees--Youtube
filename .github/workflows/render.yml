name: render

# Gate 1, then the render. Manual only.
#
# Pressing "Run workflow" is the approval: you have read the script that
# `draft` mailed you, and triggering this records that you asked. A cron
# cannot reach it -- workflow_dispatch is the only trigger here, and
# pipeline/gates.py independently refuses to clear a gate during a
# scheduled run, because a workflow file is something someone can edit.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id, as the draft mail named it"
        required: true
      voice_engine:
        description: "kokoro (publishable) or silent (preview only)"
        required: false
        default: kokoro
        type: choice
        options: [kokoro, silent]
      look:
        description: "Finishing pass"
        required: false
        default: clean
        type: choice
        options: [clean, filmic, none]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ID: ${{ inputs.episode }}
      VOICE_ENGINE: ${{ inputs.voice_engine }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      # Storage and pictures. Every one of these is safe to leave
      # unset: the pipeline treats missing storage as "not configured"
      # and an empty tuning value as its default.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_STORAGE_CAP_GB: ${{ vars.R2_STORAGE_CAP_GB }}
      R2_RETAIN_DAYS: ${{ vars.R2_RETAIN_DAYS }}
      IMAGE_PROVIDERS: ${{ vars.IMAGE_PROVIDERS }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      IMAGE_WORKERS: ${{ vars.IMAGE_WORKERS }}
      IMAGE_MAX_NEW: ${{ vars.IMAGE_MAX_NEW }}
      IMAGE_PACE_SEC: ${{ vars.IMAGE_PACE_SEC }}
      IMAGE_STYLE: ${{ vars.IMAGE_STYLE }}
      # A runner has no voice reference on disk; this is where it gets
      # one. The key reads it from the private bucket, so no link exists
      # that could clone the speaker if it leaked.
      VOICE_REFERENCE_KEY: ${{ secrets.VOICE_REFERENCE_KEY }}
      VOICE_REFERENCE_URL: ${{ secrets.VOICE_REFERENCE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The CPU wheel, not the CUDA one: a runner has no GPU and the
      # default wheel pulls gigabytes of CUDA libraries for nothing.
      - name: Cache the voice model
        if: inputs.voice_engine == 'kokoro'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: voice-${{ runner.os }}-${{ hashFiles('requirements-voice.txt') }}

      - name: Install the voice engine
        if: inputs.voice_engine == 'kokoro'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile numpy

      - name: Fetch the drafted episode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # episodes/ is gitignored, so the draft arrives as the artifact
          # the scheduled run left behind.
          mkdir -p episodes
          RUN=$(gh run list --workflow=draft.yml --limit 50 \
                  --json databaseId,status \
                  --jq '[.[] | select(.status=="completed")] | .[].databaseId' \
                | while read -r r; do
                    if gh run view "$r" --json name >/dev/null 2>&1 && \
                       gh api "repos/${{ github.repository }}/actions/runs/$r/artifacts" \
                         --jq '.artifacts[].name' | grep -qx "draft-$ID"; then
                      echo "$r"; break
                    fi
                  done)
          if [ -z "$RUN" ]; then
            echo "::error::no draft artifact named draft-$ID in the last 50 draft runs"
            exit 1
          fi
          gh run download "$RUN" -n "draft-$ID" -D "episodes/$ID"
          python run.py "$ID" --status

      - name: Clear Gate 1
        run: |
          # Only reachable on workflow_dispatch. gates.py refuses on a
          # schedule even if this file were changed to try.
          python run.py "$ID" --approve-script

      # Pictures drawn by an earlier run, on this machine or any other.
      # A runner starts with an empty disk, so without this every
      # episode redraws every scene -- and the free generator refuses
      # about half of what it is asked.
      - name: Fetch the picture library
        continue-on-error: true
        run: python run.py archive --restore-library

      - name: Render
        run: |
          python run.py "$ID" \
            --voice-engine "$VOICE_ENGINE" \
            --look "${{ inputs.look }}"
          python run.py "$ID" --status

      # The bucket outlives the artifact: a render artifact is deleted
      # after seven days, and record/ and library/ never expire.
      - name: Back up the record and the pictures
        if: always()
        continue-on-error: true
        run: python run.py archive --backup

      # Only what reviewing needs. The whole directory is ~50 MB, most of
      # it scene WAVs that are no longer needed once the mix exists, and
      # artifact storage on the free plan is 500 MB.
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.episode }}
          retention-days: 7
          path: |
            episodes/${{ inputs.episode }}/manifest.json
            episodes/${{ inputs.episode }}/metadata.json
            episodes/${{ inputs.episode }}/script.md
            episodes/${{ inputs.episode }}/captions.srt
            episodes/${{ inputs.episode }}/input/data.json
            episodes/${{ inputs.episode }}/out/video.mp4
            episodes/${{ inputs.episode }}/out/thumb_*.png
            episodes/${{ inputs.episode }}/out/shorts/short_*.mp4

      - name: Say it is ready to watch
        if: success()
        run: |
          python - <<'PY'
          import os
          from pipeline import notify
          ch = notify.Channel()
          if not ch.configured:
              print("alerts not configured; skipping")
              raise SystemExit(0)
          ep = os.environ["ID"]
          run = ("https://github.com/${{ github.repository }}/actions/runs/"
                 "${{ github.run_id }}")
          ch.send(
              f"[net-of-fees] {ep} is rendered and waiting at Gate 2",
              f"Episode {ep} rendered with the "
              f"{os.environ['VOICE_ENGINE']} voice.\n\n"
              f"Download the video from the run artifacts and watch it:\n"
              f"  {run}\n\n"
              "Happy with it? Run the `publish` workflow with this episode\n"
              "id. Nothing is public until you do.",
          )
          print("notified", ch.to)
          PY
