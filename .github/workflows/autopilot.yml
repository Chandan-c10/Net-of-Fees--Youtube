name: autopilot

# One story, start to finish, with nobody watching.
#
# Takes the next title from stories/QUEUE.md, writes it, draws it,
# narrates it, renders it, uploads it, and backs it up. The only thing
# it needs from a person is titles in the queue -- running out is the
# one way it stops, and it says so by mail rather than quietly making
# nothing.
#
# IT CAN ONLY PUBLISH IF YOU LET IT. AUTO_APPROVE_GATE_1 and
# AUTO_APPROVE_GATE_2 are off unless set. With neither set this workflow
# still writes and renders the story and then stops, which is a useful
# thing on its own: the video is waiting for you instead of the blank
# page.
#
# Every setting below is read from a repository variable or, failing
# that, a secret of the same name, because "I put it in the other list"
# must not mean "nothing happened and nothing said why". Prefer a
# variable: a secret's value is redacted from the logs, so a gate set
# as a secret with the value `true` blanks the word `true` out of every
# line this workflow prints.

# TWO A DAY, one for each publishing slot. That is what the free image
# quota affords: an episode costs around twenty-five generated pictures
# and Cloudflare gives roughly forty to sixty a day, so a third and
# fourth video would be drawn from an empty well and come out borrowed.
#
# THE TIMES ARE APPROXIMATE AND CANNOT BE MADE EXACT. GitHub runs
# free-tier scheduled workflows late -- measured here at 4.8 to 7.8
# hours over five runs -- so these crons are set early to compensate
# for the usual delay rather than to say when the video appears. A run
# publishes when it finishes. If a posting time ever has to be exact,
# the mechanism is already there: render ahead, set publish_after to a
# slot, and let publish-due release it.

on:
  schedule:
    # Each is set about seven hours before the time it aims at, which
    # is the median lateness measured over five runs. A run that is not
    # late will post early rather than at the stated hour; that was
    # accepted as the price of not rebuilding the publishing path.
    - cron: "30 16 * * *"  # 22:00 IST; aims at 05:00 IST (morning)
    - cron: "30 3 * * *"   # 09:00 IST; aims at 16:00 IST (evening)
  workflow_dispatch:
    inputs:
      title:
        description: "Story title (blank = next in the queue)"
        required: false
      profile:
        required: false
        default: storyboard_shorts

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VOICE_ENGINE: kokoro
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
      AUTO_APPROVE_GATE_1: ${{ vars.AUTO_APPROVE_GATE_1 || secrets.AUTO_APPROVE_GATE_1 }}
      AUTO_APPROVE_GATE_2: ${{ vars.AUTO_APPROVE_GATE_2 || secrets.AUTO_APPROVE_GATE_2 }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || secrets.YOUTUBE_PRIVACY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD || vars.SMTP_APP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || vars.ALERT_EMAIL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
      R2_STORAGE_CAP_GB: ${{ vars.R2_STORAGE_CAP_GB || secrets.R2_STORAGE_CAP_GB }}
      R2_RETAIN_DAYS: ${{ vars.R2_RETAIN_DAYS || secrets.R2_RETAIN_DAYS }}
      R2_IMAGE_RETAIN_DAYS: ${{ vars.R2_IMAGE_RETAIN_DAYS || secrets.R2_IMAGE_RETAIN_DAYS }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN || vars.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN || vars.HUGGINGFACE_TOKEN }}
      IMAGE_PROVIDERS: ${{ vars.IMAGE_PROVIDERS || secrets.IMAGE_PROVIDERS }}
      IMAGE_MAX_NEW: ${{ vars.IMAGE_MAX_NEW || secrets.IMAGE_MAX_NEW }}
      IMAGE_STYLE: ${{ vars.IMAGE_STYLE || secrets.IMAGE_STYLE }}
      IMAGE_WORKERS: ${{ vars.IMAGE_WORKERS || secrets.IMAGE_WORKERS }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON || vars.YOUTUBE_TOKEN_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-voice.txt
          pip install -r requirements-publish.txt
          pip install google-generativeai

      # The episodes directory is not in the repository, so what has
      # already been made has to come from the bucket, or the queue
      # would start again at the first title every single morning.
      - name: Remember what has already been made
        id: remember
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          from pipeline import archive
          target = archive.Target()
          if not target.configured:
              print("no storage; the queue cannot tell what was made")
              raise SystemExit(0)
          for row in archive.archived_episodes(target):
              out = Path("episodes") / row["id"]
              out.mkdir(parents=True, exist_ok=True)
              try:
                  archive.fetch(archive.record_key(row["id"], "manifest.json"),
                                out / "manifest.json", target)
              except Exception as exc:
                  print(f"{row['id']}: {exc}")
          print("restored the record of", len(list(Path("episodes").iterdir())),
                "episodes")
          PY

      - name: Choose the story
        id: pick
        run: |
          python - <<'PY'
          import os, pathlib
          from pipeline import queue
          wanted = """${{ inputs.title }}""".strip()
          title = wanted or queue.next_title()
          if not title:
              print("::error::the story queue is empty. Add titles to "
                    "stories/QUEUE.md or the channel stops.")
              raise SystemExit(1)
          eid = queue.episode_id_for(title)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"title={title}\n")
              out.write(f"id={eid}\n")
          print(f"making {eid}: {title}")
          PY

      - name: Write it
        env:
          ID: ${{ steps.pick.outputs.id }}
          TITLE: ${{ steps.pick.outputs.title }}
        run: |
          python run.py new --id "$ID" --title "$TITLE" \
            --profile "${{ inputs.profile || 'storyboard_shorts' }}" \
            --recipe story --force
          python run.py "$ID" --stage script --script-engine story --force
          python run.py "$ID" --stage scrub
          head -40 "episodes/$ID/script.md"

      - name: Fetch the picture library
        id: library
        continue-on-error: true
        run: python run.py archive --restore-library

      # `continue-on-error` is right here -- a missing library must not
      # kill a run -- but it also paints the step green, and a step that
      # says "success" after failing is lying to the only person reading.
      # The library is what a scene borrows from when every generator is
      # out of quota, so without it the video comes out as walls of text
      # and nothing has said why.
      - name: Note what is missing
        if: always()
        run: |
          note() {
            echo "::warning title=degraded::$1"
            echo "DEGRADED=$1" >> "$GITHUB_ENV"
          }
          if [ "${{ steps.remember.outcome }}" != "success" ]; then
            note "the record of past episodes did not load, so the queue may remake a story"
          fi
          if [ "${{ steps.library.outcome }}" != "success" ]; then
            note "the picture library did not arrive, so scenes no provider could draw are text rather than pictures"
          fi

      - name: Render it
        env:
          ID: ${{ steps.pick.outputs.id }}
        run: |
          python run.py "$ID" --approve-script
          python run.py "$ID" --voice-engine "$VOICE_ENGINE"
          python run.py check "$ID" || true
          python run.py "$ID" --status

      - name: Publish it
        # `env`, not `vars`: a step `if` cannot see `secrets`, and the
        # job env above accepts the setting from either place.
        if: env.AUTO_APPROVE_GATE_2 == 'true' || env.AUTO_APPROVE_GATE_2 == '1'
        env:
          ID: ${{ steps.pick.outputs.id }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube_token.json
          python run.py "$ID" --approve
          python run.py "$ID" --stage shorts
          python run.py "$ID" --stage upload

      - name: Remove the token
        if: always()
        run: rm -f secrets/youtube_token.json

      - name: Back it up
        id: backup
        if: always()
        continue-on-error: true
        run: python run.py archive --backup

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-${{ steps.pick.outputs.id }}
          retention-days: 7
          path: |
            episodes/${{ steps.pick.outputs.id }}/manifest.json
            episodes/${{ steps.pick.outputs.id }}/metadata.json
            episodes/${{ steps.pick.outputs.id }}/script.md
            episodes/${{ steps.pick.outputs.id }}/out/video.mp4

      - name: Say what happened
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, pathlib
          from pipeline import notify, queue
          ch = notify.Channel()
          if not ch.configured:
              raise SystemExit(0)
          eid = "${{ steps.pick.outputs.id }}"
          title = "${{ steps.pick.outputs.title }}"
          manifest = pathlib.Path(f"episodes/{eid}/manifest.json")
          video = ""
          if manifest.exists():
              m = json.loads(manifest.read_text())
              row = next((r for r in m.get("platform_posts", [])
                          if r["platform"] == "youtube"), None)
              if row and row.get("external_id"):
                  video = f"https://youtube.com/watch?v={row['external_id']}"
          left = queue.report()
          run = ("https://github.com/${{ github.repository }}/actions/runs/"
                 "${{ github.run_id }}")
          degraded = os.getenv("DEGRADED", "")
          if "${{ steps.backup.outcome }}" not in ("success", ""):
              degraded = ((degraded + "; ") if degraded else "") + (
                  "the backup did not run, so this episode exists only on "
                  "a runner that is about to be destroyed")
          ch.send(
              f"{title}" + (" (degraded)" if degraded else ""),
              (f"{title}\n\n"
               + (f"Published: {video}\n\n" if video else
                  f"Rendered and waiting. {run}\n\n")
               + (f"WENT WRONG: {degraded}\n\n" if degraded else "")
               + f"{left['remaining']} stories left in the queue.\n"
               + ("ADD MORE TITLES -- the queue is empty after this one.\n"
                  if left["remaining"] <= 1 else "")),
          )
          PY
